name: Production Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    # Placeholders de ambiente: apenas para o BUILD compilar sem segredos reais.
    # Nenhuma credencial de produção é necessária nesta etapa (o sitemap degrada
    # graciosamente se o banco não estiver acessível).
    env:
      DATABASE_URL: postgres://ci_placeholder:ci_placeholder@localhost:5432/ci_placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token
      MERCADOPAGO_ACCESS_TOKEN: ci-placeholder-token
      MERCADOPAGO_WEBHOOK_SECRET: ci-placeholder-secret
      DAILY_API_KEY: ci-placeholder-key
      CRON_SECRET: ci-placeholder-secret
      NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ci-placeholder-public-key
      NEXT_PUBLIC_SITE_URL: https://ci-placeholder.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings tolerated)
        run: npx eslint src/ --max-warnings=0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Turbopack)
        run: npm run build
