services:
  postiz-postgres:
    image: postgres:16-alpine
    container_name: nkl-postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTIZ_DB_USER:-postiz}
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD:?Defina POSTIZ_DB_PASSWORD no .env.postiz}
      POSTGRES_DB: ${POSTIZ_DB_NAME:-postiz}
    volumes:
      - postiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTIZ_DB_USER:-postiz} -d ${POSTIZ_DB_NAME:-postiz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz-redis:
    image: redis:7-alpine
    container_name: nkl-postiz-redis
    restart: unless-stopped
    volumes:
      - postiz_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: nkl-postiz-app
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    ports:
      - "${POSTIZ_PORT:-4007}:5000"
    environment:
      MAIN_URL: ${POSTIZ_MAIN_URL:-http://localhost:4007}
      FRONTEND_URL: ${POSTIZ_MAIN_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_MAIN_URL:-http://localhost:4007}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET:?Defina POSTIZ_JWT_SECRET com pelo menos 32 caracteres}
      DATABASE_URL: postgresql://${POSTIZ_DB_USER:-postiz}:${POSTIZ_DB_PASSWORD:?Defina POSTIZ_DB_PASSWORD}@postiz-postgres:5432/${POSTIZ_DB_NAME:-postiz}
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
    volumes:
      - postiz_uploads:/uploads

volumes:
  postiz_postgres_data:
  postiz_redis_data:
  postiz_uploads:
